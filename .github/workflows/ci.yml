name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            jampiersantiagomorenoarenas/k8s-demo:latest
            jampiersantiagomorenoarenas/k8s-demo:${{ github.sha }}

      - name: Update image tag in Helm values
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" helm/microservicio/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/microservicio/values.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push